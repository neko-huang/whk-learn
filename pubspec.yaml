name: study_helper
description: 高中学助 - 易错点管理与学习辅助工具
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.9
  
  # 数据库
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  
  # 路由
  go_router: ^13.0.1
  
  # 图片选择
  image_picker: ^1.0.5
  image: ^4.1.3
  
  # 本地通知
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # PDF 导出
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # 图表
  fl_chart: ^0.66.0
  
  # 路径管理
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # 权限
  permission_handler: ^11.1.0
  
  # 共享偏好（简单配置存储）
  shared_preferences: ^2.2.2
  
  # 日期选择
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # drift 代码生成
  drift_dev: ^2.14.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
